
<!DOCTYPE html>
<html>
<head>
<title>Space Shooter Game</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #05051b;
    color: white;
    font-family: Arial;
    text-align: center;
}

h1 {
    color: #00ffff;
    text-shadow: 0 0 15px cyan;
}

#scoreboard {
    font-size: 20px;
    margin: 10px;
}

#game {
    width: 400px;
    height: 550px;
    background: linear-gradient(#080828, #171744);
    margin: auto;
    position: relative;
    overflow: hidden;
    border: 3px solid cyan;
    box-shadow: 0 0 20px cyan;
}

#player {
    position: absolute;
    bottom: 20px;
    left: 175px;
    font-size: 42px;
}

.bullet {
    position: absolute;
    width: 6px;
    height: 18px;
    background: yellow;
    border-radius: 5px;
    box-shadow: 0 0 10px yellow;
}

.enemy {
    position: absolute;
    font-size: 32px;
}

.star {
    position: absolute;
    color: white;
}

button {
    padding: 12px 25px;
    margin: 12px;
    background: cyan;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: yellow;
}

#instructions {
    color: #aaa;
}
</style>
</head>

<body>

<h1>🚀 GALAXY SPACE SHOOTER</h1>

<div id="scoreboard">
    Score: <span id="score">0</span>
    |
    Lives: <span id="lives">3</span>
</div>

<div id="game">
    <div id="player">🚀</div>
</div>

<button onclick="startGame()">START / RESTART</button>

<p id="instructions">
    ⬅️ LEFT | RIGHT ➡️ | SPACE = SHOOT
</p>

<script>

const game = document.getElementById("game");
const player = document.getElementById("player");

let playerX = 175;
let score = 0;
let lives = 3;
let bullets = [];
let enemies = [];
let keys = {};
let running = false;
let frame = 0;
let enemySpeed = 2;
let animation;

document.addEventListener("keydown", function(e) {
    keys[e.code] = true;

    if (e.code === "Space") {
        e.preventDefault();
    }
});

document.addEventListener("keyup", function(e) {
    keys[e.code] = false;
});

function startGame() {

    cancelAnimationFrame(animation);

    document.querySelectorAll(".bullet, .enemy")
        .forEach(item => item.remove());

    bullets = [];
    enemies = [];
    keys = {};

    playerX = 175;
    score = 0;
    lives = 3;
    frame = 0;
    enemySpeed = 2;

    running = true;

    player.style.left = playerX + "px";

    document.getElementById("score").innerText = score;
    document.getElementById("lives").innerText = lives;

    gameLoop();
}

function shoot() {

    let bullet = document.createElement("div");

    bullet.className = "bullet";

    bullet.style.left = (playerX + 18) + "px";
    bullet.style.top = "490px";

    game.appendChild(bullet);

    bullets.push({
        element: bullet,
        x: playerX + 18,
        y: 490
    });
}

function createEnemy() {

    let enemy = document.createElement("div");

    enemy.className = "enemy";
    enemy.innerText = "👾";

    let x = Math.random() * 350;

    enemy.style.left = x + "px";
    enemy.style.top = "-40px";

    game.appendChild(enemy);

    enemies.push({
        element: enemy,
        x: x,
        y: -40
    });
}

let shootDelay = 0;

function gameLoop() {

    if (!running) return;

    frame++;

    // Player movement

    if (keys["ArrowLeft"] || keys["KeyA"]) {
        playerX -= 5;
    }

    if (keys["ArrowRight"] || keys["KeyD"]) {
        playerX += 5;
    }

    playerX = Math.max(0, Math.min(350, playerX));

    player.style.left = playerX + "px";

    // Shooting

    shootDelay++;

    if (keys["Space"] && shootDelay > 12) {
        shoot();
        shootDelay = 0;
    }

    // Create enemies

    if (frame % 55 === 0) {
        createEnemy();
    }

    // Move bullets

    bullets.forEach((b, i) => {

        b.y -= 8;

        b.element.style.top = b.y + "px";

        if (b.y < 0) {
            b.element.remove();
            bullets.splice(i, 1);
        }
    });

    // Move enemies

    enemies.forEach((e, i) => {

        e.y += enemySpeed;

        e.element.style.top = e.y + "px";

        // Enemy collision with player

        if (
            e.y > 470 &&
            e.y < 535 &&
            e.x < playerX + 40 &&
            e.x + 35 > playerX
        ) {
            e.element.remove();
            enemies.splice(i, 1);

            lives--;

            document.getElementById("lives").innerText = lives;

            if (lives <= 0) {
                endGame();
            }
        }
    });

    // Bullet and enemy collision

    bullets.forEach((b, bi) => {

        enemies.forEach((e, ei) => {

            if (
                b.x < e.x + 35 &&
                b.x + 6 > e.x &&
                b.y < e.y + 35 &&
                b.y + 18 > e.y
            ) {

                b.element.remove();
                e.element.remove();

                bullets.splice(bi, 1);
                enemies.splice(ei, 1);

                score += 10;

                document.getElementById("score").innerText = score;

                if (score % 100 === 0) {
                    enemySpeed += 0.5;
                }
            }

        });

    });

    // Enemy reaches bottom

    enemies.forEach((e, i) => {

        if (e.y > 550) {

            e.element.remove();
            enemies.splice(i, 1);

            lives--;

            document.getElementById("lives").innerText = lives;

            if (lives <= 0) {
                endGame();
            }
        }

    });

    if (running) {
        animation = requestAnimationFrame(gameLoop);
    }
}

function endGame() {

    running = false;

    cancelAnimationFrame(animation);

    alert("GAME OVER! Your Score: " + score);

}

</script>

</body>
</html>
